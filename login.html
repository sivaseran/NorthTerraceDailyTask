<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>North Terrace Login</title></head><body><header class="topbar"><div><h1>North Terrace Service Station</h1><p>Daily Task Management</p></div><a class="btn ghost" href="index.html">General View</a></header><main class="container narrow"><section class="card" style="margin-top:60px;text-align:center"><h2>Enter PIN</h2><p class="muted">Staff and managers use the same login.</p><input id="pin" type="password" inputmode="numeric" maxlength="6" style="font-size:28px;text-align:center;letter-spacing:8px" placeholder="••••"><button id="login" class="btn full">Continue</button><p id="err" class="error"></p></section></main><script type="module">import{loginWithPin,saveSession}from'./js/auth.js';const p=document.querySelector('#pin'),e=document.querySelector('#err');async function go(){e.textContent='';try{const u=await loginWithPin(p.value.trim());saveSession(u);location.href=u.role==='manager'?'manager.html':'staff.html'}catch(x){e.textContent=x.message||'Login failed'}}document.querySelector('#login').onclick=go;p.onkeydown=x=>{if(x.key==='Enter')go()}</script></body></html>
