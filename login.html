<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#20252b">
  <title>North Terrace Login</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">NT</div>
    <div class="brand-text"><div class="brand-kicker">North Terrace</div><h1>Operations</h1><p>One team. One live plan.</p></div>
  </div>
  <div class="top-actions">
    <span id="connectionStatus" class="connection-pill"><span class="connection-dot"></span>Checking…</span>
    <a class="btn ghost" href="index.html">General View</a>
  </div>
</header>

<main class="login-shell">
  <section class="card login-card">
    <div class="login-icon" aria-hidden="true">#</div>
    <h2>Enter your PIN</h2>
    <p class="muted">The app automatically opens the correct Staff or Manager view.</p>
    <div class="field">
      <label class="field-label" for="pin">PIN <span class="required">*</span></label>
      <input id="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" placeholder="••••" aria-describedby="pinError">
      <div id="pinError" class="field-error" hidden></div>
    </div>
    <button id="login" class="btn full" type="button">Continue</button>
    <div id="loginMessage" class="inline-message error" hidden role="alert"></div>
    <div class="login-footer">Staff PINs are 4 digits. Manager PINs can be changed from Manager Settings.</div>
  </section>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
